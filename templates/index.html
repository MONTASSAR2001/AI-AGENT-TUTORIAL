<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Agent</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 600px; background: white; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 90vh; margin-top: 20px; border-radius: 10px; overflow: hidden; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 20px; max-width: 75%; line-height: 1.4; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .bot { background: #e9ecef; color: black; align-self: flex-start; }
        .input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; background: #fff; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        button { margin-left: 10px; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .loading { font-style: italic; color: #888; font-size: 0.8em; align-self: flex-start; margin-left: 10px; display: none;}
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-box" id="chat-box">
        <div class="message bot">Hello! I am your AI Research Agent. Ask me anything! 🤖</div>
    </div>
    <div id="loading" class="loading">Thinking...</div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your query..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");
        const loading = document.getElementById("loading");
        const message = inputField.value.trim();

        if (!message) return;

        chatBox.innerHTML += `<div class="message user">${message}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;
        
        loading.style.display = "block";

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            });
            const data = await response.json();

            let formattedResponse = data.response.replace(/\n/g, "<br>");
            chatBox.innerHTML += `<div class="message bot">${formattedResponse}</div>`;
        } catch (error) {
            chatBox.innerHTML += `<div class="message bot" style="color:red">Error communicating with server.</div>`;
        }

        loading.style.display = "none";
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleEnter(event) {
        if (event.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
